name: Secure Build Gate

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:

  terraform-format:
    name: Terraform Format Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive


  terraform-validate:
    name: Terraform Validation Gate
    runs-on: ubuntu-latest

    needs:
      - terraform-format

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate


  terraform-security:
    name: Terraform Security Gate
    runs-on: ubuntu-latest

    needs:
      - terraform-validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy IaC security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: 1


  secret-scan:
    name: Hardcoded Secret Gate
    runs-on: ubuntu-latest

    needs:
      - terraform-format

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  deployment-gate:
    name: FINAL DEPLOYMENT GATE
    runs-on: ubuntu-latest

    needs:
      - terraform-security
      - secret-scan

    steps:
      - name: Deployment authorization
        run: |
          echo "=========================================="
          echo " ALL SECURITY GATES PASSED "
          echo " DEPLOYMENT MAY PROCEED "
          echo "=========================================="

